# Dependabot keeps both the workflow action pins and the NuGet package
# references current, so neither drifts behind a security patch or a runner
# deprecation. Updates arrive as PRs; nothing here merges itself.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # Batch all action bumps into one PR - they're low-risk version pins.
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5

  # The workflows pin actions to commit SHAs rather than tags, so a moved tag
  # cannot change what runs in CI. Dependabot understands that form and updates
  # both the SHA and the trailing "# vX.Y" comment, so pinning does not turn
  # into drift nobody maintains.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      nuget:
        patterns:
          - "*"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
