name: Release Windows app

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT: CleanMachine.Windows/CleanMachine.Windows.csproj
  TESTS: CleanMachine.Windows.Tests/CleanMachine.Windows.Tests.csproj
  # Fallback publisher used for self-signed builds when WINDOWS_PUBLISHER is not set.
  # Must be a valid X.500 name; it is written into the package identity and the signing cert.
  DEFAULT_PUBLISHER: "CN=CleanMachine Publisher"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runtime: win-x64
          - platform: ARM64
            runtime: win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Resolve version and publisher
        shell: pwsh
        env:
          WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          $ref = "${env:GITHUB_REF_NAME}"
          $isTag = "${env:GITHUB_REF}".StartsWith("refs/tags/")
          if ($ref -match '^v(\d+)\.(\d+)\.(\d+)$') {
            $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          }
          elseif ($isTag) {
            # The push trigger (v*.*.*) also matches tags like v1.0.0.1 or v1.2.3-rc1.
            # Refuse to publish a release stamped with a placeholder version.
            throw "Tag '$ref' is not a valid vMAJOR.MINOR.PATCH version; refusing to publish a mis-versioned release."
          }
          else {
            $version = "0.0.1"; Write-Host "Ref '$ref' is not a version tag; using placeholder version $version for this manual build."
          }
          $publisher = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PUBLISHER)) { $env:DEFAULT_PUBLISHER } else { $env:WINDOWS_PUBLISHER }
          $safeTag = ($ref -replace '[^A-Za-z0-9._-]', '-')
          "VERSION3=$version"        | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION4=$version.0"      | Out-File -FilePath $env:GITHUB_ENV -Append
          "PUBLISHER=$publisher"     | Out-File -FilePath $env:GITHUB_ENV -Append
          "SAFE_TAG=$safeTag"        | Out-File -FilePath $env:GITHUB_ENV -Append
          "MSIX_NAME=CleanMachine-${{ matrix.platform }}-$safeTag" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore $env:PROJECT
          dotnet restore $env:TESTS
      - name: Run tests
        shell: pwsh
        run: dotnet test $env:TESTS -c Release -p:Platform=x64 --no-restore
      - name: Sign and package MSIX
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Stamp the package identity so the publisher matches the signing certificate
          # and the version matches the release tag (required for update detection).
          $manifestPath = "CleanMachine.Windows/Package.appxmanifest"
          [xml]$manifest = Get-Content $manifestPath
          $manifest.Package.Identity.Publisher = $env:PUBLISHER
          $manifest.Package.Identity.Version = $env:VERSION4
          $manifest.Save((Resolve-Path $manifestPath))

          New-Item -ItemType Directory -Force -Path signing | Out-Null
          $pfx = Join-Path $pwd "signing/CleanMachine.pfx"

          if (-not [string]::IsNullOrEmpty($env:CERTIFICATE_BASE64)) {
            if ([string]::IsNullOrEmpty($env:CERTIFICATE_PASSWORD)) { throw "WINDOWS_SIGNING_CERTIFICATE_PASSWORD is required when a signing certificate is configured." }
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
            Write-Host "Importing the provided production certificate."
          }
          else {
            # No production certificate configured: mint a throwaway self-signed
            # code-signing certificate whose subject matches the package publisher.
            $rawPassword = [Guid]::NewGuid().ToString('N')
            Write-Host "::add-mask::$rawPassword"
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $env:PUBLISHER `
              -KeyUsage DigitalSignature -FriendlyName "CleanMachine self-signed" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
            $password = ConvertTo-SecureString $rawPassword -AsPlainText -Force
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force
            Write-Host "Minted a self-signed certificate for $env:PUBLISHER."
          }

          # Import the PFX into the user store and sign by thumbprint.
          # MSBuild's direct PFX key-file import (PackageCertificateKeyFile) fails on
          # hosted runners with APPX0105/APPX0107; importing explicitly and passing
          # PackageCertificateThumbprint is the reliable path.
          $signCert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object HasPrivateKey | Select-Object -First 1
          if ($null -eq $signCert) { throw "Signing certificate could not be imported from the PFX (no private key)." }
          Write-Host "Signing with certificate $($signCert.Thumbprint) [$($signCert.Subject)]."

          dotnet msbuild $env:PROJECT /t:Publish `
            /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:RuntimeIdentifier=${{ matrix.runtime }} `
            /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=true "/p:PackageCertificateThumbprint=$($signCert.Thumbprint)" `
            "/p:ApplicationDisplayVersion=$env:VERSION3" `
            /p:GenerateAppxPackageOnBuild=true
            # GenerateAppxPackageOnBuild is what actually invokes MakeAppx; without it
            # /t:Publish only lays out the publish folder and the *.msix search below fails.

          $package = Get-ChildItem -Path CleanMachine.Windows/bin -Recurse -Filter *.msix | Select-Object -First 1
          if ($null -eq $package) { throw "MSIX package was not generated." }
          Copy-Item $package.FullName "$env:MSIX_NAME.msix"
          Remove-Item "Cert:\CurrentUser\My\$($signCert.Thumbprint)" -Force
          Remove-Item $pfx -Force
          Write-Host "MSIX package created: $env:MSIX_NAME.msix"
      - name: Validate signature and publisher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Resolve-Path "$env:MSIX_NAME.msix"
          $signature = Get-AuthenticodeSignature $package
          # Self-signed certificates chain to an untrusted root on the runner, which reports
          # NotTrusted/UnknownError; accept those while still rejecting genuinely broken
          # signatures (HashMismatch, NotSigned, etc.).
          if ($signature.Status -notin @('Valid', 'UnknownError', 'NotTrusted')) { throw "Invalid Authenticode signature: $($signature.Status)" }
          if ($null -eq $signature.SignerCertificate) { throw "The MSIX package is not signed." }
          if (-not $signature.SignerCertificate.Subject.Contains($env:PUBLISHER, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Unexpected package publisher: $($signature.SignerCertificate.Subject)"
          }
          Write-Host "Publisher validation passed for $env:PUBLISHER."
      - name: Hash package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          (Get-FileHash "$env:MSIX_NAME.msix" -Algorithm SHA256).Hash | Out-File -NoNewline "$env:MSIX_NAME.sha256"
          Write-Host "Hash created."
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: CleanMachine-${{ matrix.platform }}
          path: |
            ${{ env.MSIX_NAME }}.msix
            ${{ env.MSIX_NAME }}.sha256

  installer:
    # The classic setup exe: friendlier than sideloading an MSIX for users who
    # do not want to trust a self-signed certificate first. Built from the same
    # self-contained publish output the MSIX packs, stamped with the tag version.
    name: Build installer (x64)
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Resolve version
        shell: pwsh
        run: |
          $ref = "${env:GITHUB_REF_NAME}"
          if ($ref -match '^v(\d+)\.(\d+)\.(\d+)$') {
            $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          } else {
            $version = "0.0.1"
            Write-Host "Ref '$ref' is not a version tag; using placeholder version."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Restore
        shell: pwsh
        run: dotnet restore $env:PROJECT
      - name: Publish self-contained app (x64)
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT -c Release -p:Platform=x64 -p:PublishProfile=win-x64 `
            "/p:ApplicationDisplayVersion=$env:VERSION"
      - name: Sign app executable
        # An unsigned, downloaded exe is what triggers the "Windows protected your
        # PC" SmartScreen warning. Sign the app binary before Inno embeds it so
        # first runs and UAC prompts attribute to the publisher. Skipped with a
        # warning when no certificate secret is configured.
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:CERTIFICATE_BASE64)) {
            Write-Host "::warning::No code-signing certificate configured (WINDOWS_SIGNING_CERTIFICATE_BASE64): the installer and app exe are unsigned, so Windows SmartScreen will warn everyone who downloads them."
            exit 0
          }
          if ([string]::IsNullOrEmpty($env:CERTIFICATE_PASSWORD)) { throw "WINDOWS_SIGNING_CERTIFICATE_PASSWORD is required when a signing certificate is configured." }
          New-Item -ItemType Directory -Force -Path signing | Out-Null
          $pfx = Join-Path $pwd "signing/CleanMachine-installer.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object HasPrivateKey | Select-Object -First 1
          if ($null -eq $cert) { throw "Signing certificate could not be imported from the PFX (no private key)." }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found on the runner." }
          $exe = "CleanMachine.Windows/bin/x64/Release/net8.0-windows10.0.26100.0/win-x64/publish/CleanMachine.exe"
          if (-not (Test-Path $exe)) { throw "App executable not found: $exe" }
          & $signtool sign /fd sha256 /td sha256 /tr http://timestamp.digicert.com $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for the app exe (exit $LASTEXITCODE)." }
          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -notin @('Valid', 'NotTrusted', 'UnknownError')) { throw "Invalid Authenticode signature on the app exe: $($signature.Status)" }
          Write-Host "App exe signature: $($signature.Status) [$($signature.SignerCertificate.Subject)]"
          "SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            foreach ($p in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
              if ($p -and (Test-Path $p)) { $iscc = $p; break }
            }
          }
          if (-not $iscc) { throw 'Inno Setup 6 (ISCC.exe) was not found on this runner.' }
          # Pass the tag version into the script via /D (double quotes so PowerShell expands the variable).
          & $iscc "/DAppVersion=$env:VERSION" 'CleanMachine.Windows\installer\cleanmachine.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }
          $setup = Get-ChildItem 'CleanMachine.Windows/bin/installer/CleanMachine-Setup-*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $setup) { throw 'Installer exe was not produced by ISCC.' }
          $stamped = "CleanMachine-Setup-$env:VERSION.exe"
          Copy-Item $setup.FullName $stamped
          Write-Host "Installer created: $stamped ($([math]::Round((Get-Item $stamped).Length/1MB,1)) MB)"
      - name: Sign installer
        # The setup exe users download is the artifact SmartScreen judges; sign it
        # after ISCC and before upload so the release asset (and the sha256 the
        # release job computes from it) belongs to the signed file.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stamped = "CleanMachine-Setup-$env:VERSION.exe"
          if ([string]::IsNullOrEmpty($env:SIGN_THUMBPRINT)) { Write-Host "Skipping installer signing (no certificate configured)."; exit 0 }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found on the runner." }
          & $signtool sign /fd sha256 /td sha256 /tr http://timestamp.digicert.com /sha1 $env:SIGN_THUMBPRINT $stamped
          if ($LASTEXITCODE -ne 0) { throw "signtool failed for $stamped (exit $LASTEXITCODE)." }
          $signature = Get-AuthenticodeSignature $stamped
          if ($signature.Status -notin @('Valid', 'NotTrusted', 'UnknownError')) { throw "Invalid Authenticode signature on installer: $($signature.Status)" }
          if ($null -eq $signature.SignerCertificate) { throw "The installer is not signed." }
          Write-Host "Installer signature: $($signature.Status) [$($signature.SignerCertificate.Subject)]"
          Remove-Item signing/CleanMachine-installer.pfx -Force -ErrorAction SilentlyContinue
          Remove-Item "Cert:\CurrentUser\My\$env:SIGN_THUMBPRINT" -Force -ErrorAction SilentlyContinue
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: CleanMachine-Setup
          path: CleanMachine-Setup-*.exe
          if-no-files-found: error

  release:
    needs: [build, installer]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
      - name: Build and validate release manifest
        shell: bash
        env:
          PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          publisher="${PUBLISHER:-CN=CleanMachine Publisher}"
          x64_hash=$(tr -d '[:space:]' < "release/CleanMachine-x64/CleanMachine-x64-${GITHUB_REF_NAME}.sha256")
          arm64_hash=$(tr -d '[:space:]' < "release/CleanMachine-ARM64/CleanMachine-ARM64-${GITHUB_REF_NAME}.sha256")
          test "${#x64_hash}" -eq 64
          test "${#arm64_hash}" -eq 64
          # Compute the installer .exe hash for the .exe install path.
          setup_exe=$(ls release/CleanMachine-Setup/CleanMachine-Setup-*.exe 2>/dev/null | head -1)
          if [ -n "$setup_exe" ]; then
            setup_hash=$(sha256sum "$setup_exe" | cut -d' ' -f1 | tr '[:upper:]' '[:lower:]')
          else
            setup_hash=""
          fi
          export version x64_hash arm64_hash publisher setup_hash
          python3 - <<'PY'
          import json, os
          tag = os.environ['GITHUB_REF_NAME']
          publisher = os.environ['publisher']
          setup_hash = os.environ.get('setup_hash', '')
          data = {
            'version': os.environ['version'],
            'releaseNotes': 'See the GitHub release notes.',
            'packages': {
              'x64': {'packageUrl': f'https://github.com/daygle/CleanMachine/releases/download/{tag}/CleanMachine-x64-{tag}.msix', 'sha256': os.environ['x64_hash'], 'architecture': 'x64', 'publisher': publisher},
              'ARM64': {'packageUrl': f'https://github.com/daygle/CleanMachine/releases/download/{tag}/CleanMachine-ARM64-{tag}.msix', 'sha256': os.environ['arm64_hash'], 'architecture': 'ARM64', 'publisher': publisher}
            }
          }
          if setup_hash and len(setup_hash) == 64:
            data['installer'] = {
              'packageUrl': f'https://github.com/daygle/CleanMachine/releases/download/{tag}/CleanMachine-Setup-{os.environ["version"]}.exe',
              'sha256': setup_hash,
              'architecture': 'x64'
            }
          with open('update-manifest.json', 'w', encoding='utf-8') as handle: json.dump(data, handle, indent=2)
          PY
          python3 -m json.tool update-manifest.json >/dev/null
      - name: Publish GitHub release
        # The maintainer typically creates the release from the GitHub UI with a
        # hand-written description (which already contains the auto-generated
        # "Full Changelog" line). softprops/action-gh-release with
        # generate_release_notes: true regenerated notes on update and appended a
        # second Full Changelog to that body. With the gh CLI the semantics are
        # explicit: if the release exists, upload assets only and never touch the
        # body; if not, create it once with generated notes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          files=(
            release/CleanMachine-x64/*.msix
            release/CleanMachine-x64/*.sha256
            release/CleanMachine-ARM64/*.msix
            release/CleanMachine-ARM64/*.sha256
            release/CleanMachine-Setup/*.exe
            update-manifest.json
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists; uploading assets without touching the description."
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            echo "Release $tag does not exist; creating it with auto-generated notes."
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes "${files[@]}"
          fi
