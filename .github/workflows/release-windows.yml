name: Release Windows app

# The Microsoft Store is the only distribution channel (see RELEASE.md). This
# workflow therefore builds exactly one artifact: the .msixupload that Partner
# Center accepts. There is no self-signed certificate, no .exe installer
# and no GitHub release - the Store installs and updates the app.
#
# No code-signing certificate is required. Partner Center accepts an UNSIGNED
# .msixupload and signs it with Microsoft's own certificate as part of
# ingestion. Signing it yourself is optional and only useful if you want the
# package to be verifiable before it reaches the Store; set
# STORE_CERT_BASE64/STORE_CERT_PASSWORD and the job will sign and then verify
# the signature chains to a trusted root.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: CleanMachine.Windows/CleanMachine.Windows.csproj
  TESTS: CleanMachine.Windows.Tests/CleanMachine.Windows.Tests.csproj

jobs:
  store-package:
    name: Build Microsoft Store submission package
    runs-on: windows-latest
    env:
      # The exact Publisher string reserved for this app in Partner Center
      # (Product > Identity). Deliberately not defaulted: a guessed publisher
      # produces a package that uploads cleanly and then fails certification.
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      # The publisher's DISPLAY name from the same Partner Center Identity page
      # (it is not the Publisher string, and not the app name). Partner Center
      # rejects the upload when <PublisherDisplayName> does not match it exactly,
      # so it is stamped per run rather than hardcoded in the manifest.
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      # The reserved identity NAME from the same Identity page. It is NOT the app
      # name: Partner Center issues it as "<publisher display name>.<app name>"
      # (e.g. daygle.CleanMachine) and rejects any package whose Identity Name is
      # the bare app name. DisplayName stays the user-facing "CleanMachine".
      STORE_APP_NAME: ${{ vars.STORE_APP_NAME }}
      # Optional. Leave unset to submit an unsigned package (the Store signs it).
      STORE_CERT_BASE64: ${{ secrets.STORE_SIGNING_CERTIFICATE_BASE64 }}
      STORE_CERT_PASSWORD: ${{ secrets.STORE_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        shell: pwsh
        run: |
          $ref = "${env:GITHUB_REF_NAME}"
          $isTag = "${env:GITHUB_REF}".StartsWith("refs/tags/")
          if ($ref -match '^v(\d+)\.(\d+)\.(\d+)$') {
            $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          }
          elseif ($isTag) {
            # The push trigger (v*.*.*) also matches tags like v1.0.0.1 or v1.2.3-rc1.
            # Refuse to build a submission stamped with a placeholder version.
            throw "Tag '$ref' is not a valid vMAJOR.MINOR.PATCH version; refusing to build a mis-versioned package."
          }
          else {
            $version = "0.0.1"; Write-Host "Ref '$ref' is not a version tag; using placeholder version $version."
          }
          if ([string]::IsNullOrWhiteSpace($env:STORE_PUBLISHER)) {
            throw "Set the STORE_PUBLISHER repository variable to the Publisher string reserved for this app in Partner Center (Product > Identity). Refusing to build a package with a guessed publisher."
          }
          if ([string]::IsNullOrWhiteSpace($env:STORE_PUBLISHER_DISPLAY_NAME)) {
            throw "Set the STORE_PUBLISHER_DISPLAY_NAME repository variable to the publisher DISPLAY name shown on the Partner Center Identity page (Product > Identity). It is NOT the Publisher string and NOT the app name - Partner Center rejects any package whose <PublisherDisplayName> differs from it."
          }
          if ([string]::IsNullOrWhiteSpace($env:STORE_APP_NAME)) {
            throw "Set the STORE_APP_NAME repository variable to the identity NAME reserved in Partner Center (Product > Identity). It is NOT the app name: Partner Center issues it as '<publisher display name>.<app name>' (e.g. daygle.CleanMachine) and rejects a package whose Identity Name is the bare app name."
          }
          "VERSION3=$version"   | Out-File $env:GITHUB_ENV -Append
          "VERSION4=$version.0" | Out-File $env:GITHUB_ENV -Append

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore $env:PROJECT
          dotnet restore $env:TESTS

      # Tests run before packaging so a broken build never produces a submission
      # artifact. The scheduled-task test is safe on an ephemeral runner.
      - name: Run tests
        shell: pwsh
        env:
          CLEANMACHINE_RUN_SCHEDULED_TESTS: "1"
        run: dotnet test $env:TESTS -c Release -p:Platform=x64 --no-restore

      - name: Stamp the manifest with the reserved identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = "CleanMachine.Windows/Package.appxmanifest"
          [xml]$manifest = Get-Content $manifestPath
          $manifest.Package.Identity.Publisher = $env:STORE_PUBLISHER
          $manifest.Package.Identity.Version = $env:VERSION4
          # Reserved identity name, e.g. daygle.CleanMachine. DisplayName and
          # VisualElements DisplayName keep the user-facing "CleanMachine".
          $manifest.Package.Identity.Name = $env:STORE_APP_NAME
          # Must equal the Partner Center publisher DISPLAY name exactly, or
          # ingestion rejects the package before certification is ever reached.
          $manifest.Package.Properties.PublisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME
          $manifest.Save((Resolve-Path $manifestPath))
          Write-Host "Stamped publisher: $env:STORE_PUBLISHER; version: $env:VERSION4; publisher display name: $env:STORE_PUBLISHER_DISPLAY_NAME; identity name: $env:STORE_APP_NAME"

      - name: Import the optional signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:STORE_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:STORE_CERT_PASSWORD)) {
            Write-Host "No Store signing certificate configured - building an UNSIGNED package. The Store signs it on ingestion."
            "SIGN_PACKAGE=false" | Out-File $env:GITHUB_ENV -Append
            return
          }
          $pfx = Join-Path $env:RUNNER_TEMP "store.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:STORE_CERT_BASE64))
          $password = ConvertTo-SecureString $env:STORE_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object HasPrivateKey | Select-Object -First 1
          if ($null -eq $cert) { throw "Store certificate could not be imported (no private key)." }
          Write-Host "Signing with $($cert.Subject) [$($cert.Thumbprint)]"
          "SIGN_PACKAGE=true"                     | Out-File $env:GITHUB_ENV -Append
          "STORE_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append

      - name: Build the .msixupload bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # StoreUpload emits the .msixupload Partner Center accepts; SideloadOnly
          # produces a bare .msix the Store will not take. AppxBundle and
          # AppxBundlePlatforms come from the project file (one x64|arm64 bundle)
          # so there is a single source of truth for them - that pair is verified
          # to build both architectures on every push by the package-smoke CI job.
          #
          # AppxSymbolPackageEnabled is turned OFF explicitly. It DEFAULTS TO TRUE
          # (Microsoft.Windows.SDK.BuildTools.MSIX.Packaging.targets), so omitting
          # it leaves it on. When on it requires mspdbcmf.exe, a Visual Studio
          # component that is not on a GitHub windows-latest runner, and fails the
          # build with MSB6011 in WinAppSdkCheckFastlinkPdb. A symbol package is
          # optional for Store submission - it only affects de-minifying crash
          # dumps - so it is not worth a toolchain dependency to produce.
          $signArgs = @("/p:AppxPackageSigningEnabled=false", "/p:AppxSymbolPackageEnabled=false")
          if ("$env:SIGN_PACKAGE" -eq "true") {
            $signArgs = @("/p:AppxPackageSigningEnabled=true", "/p:PackageCertificateThumbprint=$env:STORE_THUMBPRINT", "/p:AppxSymbolPackageEnabled=false")
          }
          dotnet msbuild $env:PROJECT /t:Publish `
            /p:Configuration=Release /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=StoreUpload `
            "/p:ApplicationDisplayVersion=$env:VERSION3" `
            /p:GenerateAppxPackageOnBuild=true `
            @signArgs
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed (exit $LASTEXITCODE)." }
          # The Publish targets stage the .msixupload under bin/AppPackages/,
          # which is the AppxPackageDir the project pins, so search the bin tree.
          $upload = Get-ChildItem CleanMachine.Windows/bin -Recurse -Filter *.msixupload | Select-Object -First 1
          if ($null -eq $upload) {
            Write-Host "Produced instead:"; Get-ChildItem CleanMachine.Windows/bin -Recurse -Include *.msix,*.msixbundle | Select-Object -ExpandProperty Name
            throw "No .msixupload was produced."
          }
          Copy-Item $upload.FullName "CleanMachine-StoreUpload.msixupload"
          Write-Host "Upload package: $((Get-Item 'CleanMachine-StoreUpload.msixupload').Length) bytes"

      # Unpack the submission and read the identity back OUT of the package, so
      # this proves the stamping reached the artifact rather than just the log.
      # There is no Appx cmdlet that validates a package file on disk -
      # Get-AppxPackageManifest only reads packages that are already installed.
      - name: Verify the submission package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Expand-Zip([string]$path, [string]$dest) {
            if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
            [System.IO.Compression.ZipFile]::ExtractToDirectory($path, $dest)
          }

          $root = Join-Path $env:RUNNER_TEMP "verify"
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          Expand-Zip (Resolve-Path "CleanMachine-StoreUpload.msixupload") (Join-Path $root "upload")

          $bundle = Get-ChildItem (Join-Path $root "upload") -Recurse -Filter *.msixbundle | Select-Object -First 1
          if ($null -eq $bundle) { throw "No .msixbundle inside the .msixupload." }
          $bundleDir = Join-Path $root "bundle"
          Expand-Zip $bundle.FullName $bundleDir

          $packages = Get-ChildItem $bundleDir -Recurse -File -Filter *.msix
          Write-Host "Per-architecture packages: $($packages.Name -join ', ')"
          foreach ($arch in @("x64", "arm64")) {
            if (-not ($packages | Where-Object { $_.Name -like "*_${arch}.msix" -or $_.Name -like "*_${arch}_*.msix" })) {
              throw "The submission bundle contains no $arch package."
            }
          }

          $x64 = $packages | Where-Object { $_.Name -like "*_x64.msix" } | Select-Object -First 1
          $msixDir = Join-Path $root "x64"
          Expand-Zip $x64.FullName $msixDir
          [xml]$manifest = Get-Content (Join-Path $msixDir "AppxManifest.xml")
          # local-name() so the appx default namespace never has to be spelled out.
          $identity = $manifest.SelectSingleNode("//*[local-name()='Identity']")
          $publisher = $identity.GetAttribute("Publisher")
          $version = $identity.GetAttribute("Version")
          $name = $identity.GetAttribute("Name")
          $displayNameNode = $manifest.SelectSingleNode("//*[local-name()='Properties']/*[local-name()='PublisherDisplayName']")
          $publisherDisplayName = if ($null -ne $displayNameNode) { $displayNameNode.InnerText } else { "<missing>" }
          Write-Host "Package identity: Name=$name Publisher=$publisher Version=$version PublisherDisplayName=$publisherDisplayName"
          if ($name -ne $env:STORE_APP_NAME) {
            throw "Identity Name in the package ('$name') does not match the identity name reserved in Partner Center ('$($env:STORE_APP_NAME)'). Partner Center expects '<publisher display name>.<app name>', not the bare app name. Set STORE_APP_NAME to the name on the Partner Center Identity page."
          }
          if ($publisher -ne $env:STORE_PUBLISHER) {
            throw "Publisher in the package ('$publisher') does not match STORE_PUBLISHER ('$($env:STORE_PUBLISHER)')."
          }
          if ($version -ne $env:VERSION4) {
            throw "Version in the package ('$version') does not match the tag ($($env:VERSION4))."
          }
          # Partner Center fails ingestion on a mismatch here, which is expensive:
          # the package is only rejected after a 175 MB upload.
          if ($publisherDisplayName -ne $env:STORE_PUBLISHER_DISPLAY_NAME) {
            throw "PublisherDisplayName in the package ('$publisherDisplayName') does not match the publisher display name reserved in Partner Center ('$($env:STORE_PUBLISHER_DISPLAY_NAME)'). Set STORE_PUBLISHER_DISPLAY_NAME to the display name on the Partner Center Identity page."
          }

          $sig = Get-AuthenticodeSignature "CleanMachine-StoreUpload.msixupload"
          Write-Host "Signature status: $($sig.Status)"
          if ("$env:SIGN_PACKAGE" -eq "true" -and $sig.Status -ne 'Valid') {
            # Only meaningful when a certificate was configured: a self-signed one
            # reports NotTrusted, which the Store would reject.
            throw "Store package is not validly signed ($($sig.Status)). A signed submission must chain to a CA in the Microsoft Trusted Root Program - or unset the certificate secrets to submit unsigned."
          }
          Write-Host "Submission package verified."

      - name: Upload the submission package
        uses: actions/upload-artifact@v4
        with:
          name: CleanMachine-StoreUpload
          path: CleanMachine-StoreUpload.msixupload
          if-no-files-found: error
