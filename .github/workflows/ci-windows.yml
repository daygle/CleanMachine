name: Windows CI

# CI verifies that the app compiles, that the test suite passes, and that the
# Microsoft Store packaging still produces a valid multi-architecture submission
# bundle on every push/PR.
#
# The distributable artifact itself is built exclusively by the release workflow
# (release-windows.yml), which runs on v*.*.* tags (and manual workflow_dispatch)
# - see RELEASE.md. Neither job publishes anything: build-and-test compiles and
# runs the suite with MSIX packaging switched off, and package-smoke builds the
# Store submission bundle on a placeholder version and the checked-in publisher,
# purely to prove the packaging path is not broken.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: CleanMachine.Windows/CleanMachine.Windows.csproj
  TESTS: CleanMachine.Windows.Tests/CleanMachine.Windows.Tests.csproj

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore $env:PROJECT
          if ($LASTEXITCODE -ne 0) { throw "App restore failed (exit $LASTEXITCODE)." }
          dotnet restore $env:TESTS
          if ($LASTEXITCODE -ne 0) { throw "Test restore failed (exit $LASTEXITCODE)." }

      # Packaging is package-smoke's job, and the project enables single-project
      # MSIX (EnableMsixTooling), where GenerateAppxPackageOnBuild defaults to true.
      # A plain build therefore also produced an x64+arm64 sideload bundle here -
      # work this job throws away - and warned that it could not generate the
      # optional symbol package because mspdbcmf.exe is not on a windows-latest
      # runner. Both are switched off, so this step only compiles.
      # The same two properties are passed to the test step: it builds the app
      # again, and would otherwise re-enable the packaging and the warning.
      - name: Build app (x64)
        shell: pwsh
        run: dotnet build $env:PROJECT -c Release -p:Platform=x64 --no-restore /p:GenerateAppxPackageOnBuild=false /p:AppxSymbolPackageEnabled=false

      # CLEANMACHINE_RUN_SCHEDULED_TESTS=1 enables the one test that creates and runs
      # a real scheduled task. It is the only coverage that can catch a task Windows
      # refuses to schedule - a failure mode that has shipped unnoticed before - and
      # it is safe here because the runner is ephemeral. The flag is not set for
      # local runs, so `dotnet test` on a developer machine stays inert.
      - name: Run tests (x64)
        shell: pwsh
        env:
          CLEANMACHINE_RUN_SCHEDULED_TESTS: "1"
        run: dotnet test $env:TESTS -c Release -p:Platform=x64 --no-restore /p:GenerateAppxPackageOnBuild=false /p:AppxSymbolPackageEnabled=false

  # The Store submission is now the only artifact, and it is built by MSBuild
  # properties (UapAppxPackageBuildMode=StoreUpload, AppxBundle=Always,
  # AppxBundlePlatforms) that no compile or test exercises. Without this job a
  # broken bundle - a bad manifest, a missing tile, a bundling setting that stops
  # resolving - would only surface when a version tag is pushed, i.e. at the moment
  # of release. This runs the real packaging path on every PR instead.
  package-smoke:
    name: Store bundle packaging smoke check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:PROJECT

      # Crash symbols need mspdbcmf.exe, which ships with the MSVC x64/x86 build
      # tools but which the packaging targets cannot find here: dotnet msbuild
      # sets neither VsInstallRoot nor VCToolsInstallDir, and their legacy
      # AppxMSBuildToolsPath fallback does not exist in a VS 2022 layout. Resolve
      # the tool up front and pass it as MsPdbCmfExeFullpath, so the symbol
      # package is produced instead of skipped. Failing here is deliberate: a
      # release that silently ships without symbols is worse than a loud error.
      - name: Resolve mspdbcmf.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @()
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $candidates += & $vswhere -all -products * -find 'VC\Tools\MSVC\**\bin\HostX64\x64\mspdbcmf.exe'
          }
          $candidates += Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\HostX64\x64\mspdbcmf.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          # Older SDK layouts carry their own copy; accepted as a fallback.
          $candidates += Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mspdbcmf.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          $tool = @($candidates | Where-Object { $_ -and "$_".Trim() -and (Test-Path $_) }) | Select-Object -First 1
          if (-not $tool) {
            throw "mspdbcmf.exe was not found on this runner, so no crash-symbol package can be produced. It ships with the MSVC x64/x86 build tools (VC\Tools\MSVC\<version>\bin\HostX64\x64); check that the windows-latest image still installs that component."
          }
          Write-Host "mspdbcmf.exe: $tool"
          "MSPDBCMF=$tool" | Out-File $env:GITHUB_ENV -Append

      # Unsigned on purpose: the Store signs submissions, so this is the exact
      # configuration a real submission uses and needs no certificate secret.
      # The publisher is left at the checked-in default - stamping the Partner
      # Center identity is the release workflow's job, and it does not affect
      # whether packaging succeeds.
      #
      # Crash symbols are produced, not skipped: the .appxsym is bundled into the
      # .msixupload and is what makes Partner Center's crash reports readable. It
      # is built from the mspdbcmf.exe resolved above (see that step for why the
      # targets cannot find it themselves). Passing MsPdbCmfExeFullpath also
      # satisfies _EnsurePdbCmfExeFullPath's condition, which is what silences the
      # "mspdbcmf.exe could not be found" warning.
      #
      # PdbCmfx64ExeFullPath/PdbCmfx86ExeFullPath are needed as well, not just for
      # symmetry: _GenerateAppxUploadSymbolPackage recomputes MsPdbCmfExeFullpath
      # from them before invoking the task, so supplying only MsPdbCmfExeFullpath
      # leaves that task with an empty path and fails the build with MSB4044. Both
      # point at the x64-hosted tool, which is what this runner always resolves.
      #
      # AppxPackageDir is left alone: the project pins it under bin/AppPackages,
      # which is where the .msixupload lands.
      - name: Build the Store bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet msbuild $env:PROJECT /t:Publish `
            /p:Configuration=Release /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxSymbolPackageEnabled=true `
            "/p:MsPdbCmfExeFullpath=$env:MSPDBCMF" `
            "/p:PdbCmfx64ExeFullPath=$env:MSPDBCMF" `
            "/p:PdbCmfx86ExeFullPath=$env:MSPDBCMF" `
            /p:GenerateAppxPackageOnBuild=true `
            "/p:ApplicationDisplayVersion=0.0.1"
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed (exit $LASTEXITCODE)." }
          $upload = Get-ChildItem CleanMachine.Windows/bin -Recurse -Filter *.msixupload | Select-Object -First 1
          if ($null -eq $upload) {
            Write-Host "Produced instead:"; Get-ChildItem CleanMachine.Windows/bin -Recurse -Include *.msix,*.msixbundle | Select-Object -ExpandProperty Name
            throw "No .msixupload was produced."
          }
          Write-Host "Built $($upload.FullName) ($($upload.Length) bytes)"

      # A bundle that silently drops an architecture still "succeeds", so assert
      # the contents rather than trusting the exit code. The symbol package is
      # asserted too: it is optional to the Store, which is exactly why its
      # disappearance would otherwise go unnoticed until someone needed a dump.
      # Assert on the per-architecture .msix files INSIDE the bundle, not on the
      # bundle's own name: the bundle is called "..._x64_arm64.msixbundle", so a
      # substring match on it would pass even if only one architecture was in
      # there. A bundle that silently drops an architecture still exits 0.
      - name: Verify the bundle contains both architectures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $upload = Get-ChildItem CleanMachine.Windows/bin -Recurse -Filter *.msixupload | Select-Object -First 1
          $work = Join-Path $env:RUNNER_TEMP "upload-expanded"
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          # A .msixupload is a zip holding a .msixbundle (or loose .msix files).
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($upload.FullName, $work)
          $inner = Join-Path $work "bundle"
          $bundle = Get-ChildItem $work -Recurse -Filter *.msixbundle | Select-Object -First 1
          if ($null -ne $bundle) {
            [System.IO.Compression.ZipFile]::ExtractToDirectory($bundle.FullName, $inner)
          }
          else {
            $inner = $work
          }
          $packages = Get-ChildItem $inner -Recurse -File -Filter *.msix
          Write-Host "Per-architecture packages: $($packages.Name -join ', ')"
          if ($packages.Count -eq 0) {
            throw "The submission bundle contains no .msix package at all."
          }
          foreach ($arch in @("x64", "arm64")) {
            # "..._x64.msix" / "..._arm64.msix" - anchored so _arm64.msix can
            # never satisfy the x64 check.
            if (-not ($packages | Where-Object { $_.Name -like "*_${arch}.msix" -or $_.Name -like "*_${arch}_*.msix" })) {
              throw "The submission bundle contains no $arch package."
            }
          }
          Write-Host "Both x64 and arm64 packages are present in the bundle."

          # The symbol package travels beside the bundle inside the .msixupload.
          $symbols = @(Get-ChildItem $work -Recurse -File -Filter *.appxsym)
          if ($symbols.Count -eq 0) {
            throw "The submission bundle contains no .appxsym crash-symbol package."
          }
          Write-Host "Symbol package: $($symbols.Name -join ', ') ($($symbols[0].Length) bytes)"

