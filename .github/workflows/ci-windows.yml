name: Windows CI

# CI only verifies that the app compiles and the test suite passes on every
# push/PR. Distributable artifacts (.msix packages and the setup .exe) are
# built exclusively by the release workflow (release-windows.yml), which runs
# on v*.*.* tags (and manual workflow_dispatch) - see RELEASE.md. A plain
# `dotnet build` here produces no package: the packaging targets only run with
# GenerateAppxPackageOnBuild, which is deliberately not set in CI.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: CleanMachine.Windows/CleanMachine.Windows.csproj
  TESTS: CleanMachine.Windows.Tests/CleanMachine.Windows.Tests.csproj

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore $env:PROJECT
          dotnet restore $env:TESTS

      - name: Build app (x64)
        shell: pwsh
        run: dotnet build $env:PROJECT -c Release -p:Platform=x64 --no-restore

      - name: Run tests (x64)
        shell: pwsh
        run: dotnet test $env:TESTS -c Release -p:Platform=x64 --no-restore
