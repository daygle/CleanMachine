<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- CleanMachine "Fresh Screen" mark: a laptop swept clean by a brush.
       Human-readable source of truth; generate_icons.py renders the raster
       assets from this same geometry. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#204E42"/>
      <stop offset="1" stop-color="#0F2B24"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F7F4"/>
      <stop offset="1" stop-color="#CDDFD7"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FD6B0"/>
      <stop offset="1" stop-color="#2C9679"/>
    </linearGradient>
    <linearGradient id="handle" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="238" y2="0">
      <stop offset="0" stop-color="#F3B74E"/>
      <stop offset="1" stop-color="#DE842C"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- laptop base / deck -->
  <polygon points="150,300 362,300 398,346 114,346" fill="#D6E4DD"/>
  <rect x="114" y="338" width="284" height="16" rx="8" fill="#B4C9BF"/>

  <!-- screen bezel + inner screen -->
  <rect x="138" y="116" width="236" height="188" rx="22" fill="url(#bezel)"/>
  <rect x="156" y="134" width="200" height="152" rx="12" fill="url(#screen)"/>

  <!-- clean swipe + sparkle (freshly cleaned) -->
  <path d="M 300 196 L 232 230 L 182 238" fill="none" stroke="#FFFFFF" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.28"/>
  <path d="M 190 142 L 196.25 161.75 L 216 168 L 196.25 174.25 L 190 194 L 183.75 174.25 L 164 168 L 183.75 161.75 Z"
        fill="#EAFBF3"/>

  <!-- brush: local axis frame, tip pivoting on the screen -->
  <g transform="translate(238 205) rotate(-33)">
    <polygon points="2,-54 66,-42 66,42 2,54" fill="#EEF9F3"/>
    <path d="M 8 -26 L 64 -20.3 M 8 0 L 64 0 M 8 26 L 64 20.3"
          stroke="#B7D6C8" stroke-width="3" stroke-linecap="round"/>
    <line x1="74" y1="0" x2="90" y2="0" stroke="#DEE6E3" stroke-width="84" stroke-linecap="round"/>
    <line x1="96" y1="0" x2="238" y2="0" stroke="url(#handle)" stroke-width="60" stroke-linecap="round"/>
  </g>
</svg>
