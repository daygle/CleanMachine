<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- CleanMachine "Clean Cycle" mark. Source of truth for generate_icons.py,
       which renders the raster assets from this geometry. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#204E42"/>
      <stop offset="1" stop-color="#0F2B24"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3FA080"/>
      <stop offset="1" stop-color="#9FEBCE"/>
    </linearGradient>
    <linearGradient id="chk" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4FB894"/>
      <stop offset="1" stop-color="#B4F5DC"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- cycle ring, gap 282deg..368deg (upper-right) -->
  <path d="M 300.4 292 L 252.3 311 A 150 150 0 1 0 397.9 224.7"
        fill="none" stroke="url(#ring)" stroke-width="56"
        stroke-linecap="round"/>

  <!-- check: short stroke, valley, long stroke exiting the gap -->
  <path d="M 168 262 L 232 330 L 404 156"
        fill="none" stroke="url(#chk)" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparkle: fresh result -->
  <path d="M 438 56 L 446.8 87.2 L 478 96 L 446.8 104.8 L 438 136 L 429.2 104.8 L 398 96 L 429.2 87.2 Z"
        fill="#C9F7E3"/>
</svg>
